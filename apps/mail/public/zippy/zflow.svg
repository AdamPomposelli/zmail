<!--
  The app icon. The mark sits on a light ground rather than on the purple:
  a macOS Dock is already a wall of saturated tiles, and the near-black
  squares are what make this one findable at 32 points.
-->
<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="ZFlow">
  <rect width="1024" height="1024" rx="228" fill="#F7F6F3"/>
  <g transform="translate(192 192) scale(20)">
    <path d="M12 8H26C22 14 10 18 6 24H20" stroke="#6D28D9" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    <rect x="4" y="4" width="8" height="8" rx="2" fill="#171717"/>
    <rect x="20" y="20" width="8" height="8" rx="2" fill="#171717"/>
  </g>
</svg>
